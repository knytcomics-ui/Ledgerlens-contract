name: Miri & Sanitizers

# Nightly UB / memory-error coverage for the off-chain tool crates.
# Also runs on demand for pull requests labelled `security`.
# See docs/security/unsafe-code-and-sanitizers.md.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-09-01

jobs:
  miri:
    name: Miri (pure-Rust crates)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [replay, schema-gen]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri, rust-src
      - run: cargo miri setup
      - name: cargo miri test (${{ matrix.crate }})
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test -p ${{ matrix.crate }} --lib

  asan:
    name: AddressSanitizer (${{ matrix.crate }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [replay, recovery, schema-gen, invocation-fuzzer]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
      - name: cargo test under ASan + LSan with UB checks
        env:
          RUSTFLAGS: -Zsanitizer=address -Cdebug-assertions=yes -Zub-checks=yes
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
        run: >
          cargo +${{ env.NIGHTLY }} test -Zbuild-std
          --target x86_64-unknown-linux-gnu -p ${{ matrix.crate }}

  sanitizer-self-test:
    name: Sanitizer positive controls (seeded UB must be caught)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri, rust-src
      - name: Toolchain components must be present (fail loudly, never fall back)
        run: |
          rustup component list --toolchain "$NIGHTLY" --installed | grep -E '^(miri|rust-src)' | sort -u | tee components.txt
          grep -q '^miri' components.txt || { echo "::error::miri component missing; Miri jobs would not run"; exit 1; }
          grep -q '^rust-src' components.txt || { echo "::error::rust-src missing; -Zbuild-std ASan jobs would not run"; exit 1; }
      - name: Write seeded-UB program
        run: |
          cat > oob.rs <<'RS'
          fn main() {
              let v = vec![1u8, 2, 3, 4];
              let i = std::hint::black_box(4usize);
              // Deliberate bug: one past the end.
              let x = unsafe { *v.as_ptr().add(i) };
              println!("{x}");
          }
          RS
      - name: ASan must detect a seeded heap out-of-bounds read
        run: |
          rustc +${{ env.NIGHTLY }} -Zsanitizer=address -Copt-level=0 \
            --target x86_64-unknown-linux-gnu oob.rs -o oob
          if ./oob 2> asan.log; then
            echo "::error::ASan failed to detect the seeded out-of-bounds read (sanitizer silently inactive?)"
            exit 1
          fi
          grep -q "heap-buffer-overflow" asan.log \
            || { echo "::error::program failed but not with an ASan report"; cat asan.log; exit 1; }
          echo "OK: seeded out-of-bounds read detected by ASan."
      - name: Miri must detect the same seeded out-of-bounds read
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +${{ env.NIGHTLY }} miri setup
          mkdir -p miri-ctl/src && cp oob.rs miri-ctl/src/main.rs
          printf '[package]\nname = "miri-ctl"\nversion = "0.0.0"\nedition = "2021"\n[workspace]\n' > miri-ctl/Cargo.toml
          if (cd miri-ctl && cargo +${{ env.NIGHTLY }} miri run 2> ../miri.log); then
            echo "::error::Miri failed to detect the seeded out-of-bounds read"
            exit 1
          fi
          grep -q "Undefined Behavior" miri.log \
            || { echo "::error::program failed but not with a Miri UB report"; cat miri.log; exit 1; }
          echo "OK: seeded out-of-bounds read detected by Miri."
