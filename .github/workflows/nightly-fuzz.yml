name: Nightly Fuzz & Soak

# Issue #1226: extended fuzzing and soak runs with a persisted corpus, coverage
# trend and automatic crash triage. See docs/nightly-fuzzing.md.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Fuzz/soak time budget in minutes'
        required: false
        default: '90'
        type: string

# Least privilege: read the repo, write only issues (crash triage).
permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CORPUS_DIR: fuzz-state/corpus
  HISTORY_FILE: fuzz-state/history.jsonl

jobs:
  fuzz:
    name: Fuzz + soak
    # Never run on forks: scheduled runs and secrets/issue writes stay upstream.
    if: github.repository == 'Ledger-Lenz/Ledgerlens-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - uses: Swatinem/rust-cache@v2

      - name: Restore persisted corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-state
          key: fuzz-state-${{ github.run_id }}
          restore-keys: fuzz-state-

      - name: Seed and minimise corpus
        run: |
          mkdir -p "$CORPUS_DIR"
          # Checked-in fixtures always win; content-hash naming deduplicates.
          for f in tools/invocation-fuzzer/corpus/*.json "$CORPUS_DIR"/*.json; do
            [ -f "$f" ] || continue
            h=$(jq -cS . "$f" | sha256sum | cut -c1-16)
            [ -f "$CORPUS_DIR/$h.json" ] || jq -S . "$f" > "$CORPUS_DIR/$h.json.tmp"
          done
          find "$CORPUS_DIR" -name '*.json' ! -name '*.tmp' -delete
          for t in "$CORPUS_DIR"/*.tmp; do mv "$t" "${t%.tmp}"; done

      - name: Run fuzz and soak campaigns
        id: fuzz
        env:
          BUDGET_MINUTES: ${{ github.event.inputs.budget_minutes || '90' }}
        run: |
          cargo build -p invocation-fuzzer --locked --release
          BIN=target/release/invocation-fuzzer
          deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          base_seed=$(date -u +%Y%m%d)
          runs=0; max_sigs=0; status=pass
          mkdir -p crash
          # Decoder / regression targets first, then seeded soak campaigns.
          for fx in "$CORPUS_DIR"/*.json; do
            if ! $BIN replay "$fx" > crash/log.txt 2>&1; then
              status=fail; echo "cmd=cargo run -p invocation-fuzzer --locked -- replay crash/corpus/$(basename "$fx")" > crash/meta; break
            fi
          done
          while [ "$status" = pass ] && [ "$(date +%s)" -lt "$deadline" ]; do
            seed=$(( base_seed * 1000 + runs ))
            if ! $BIN smoke --seed "$seed" --cases 512 --corpus-dir "$CORPUS_DIR" > crash/log.txt 2>&1; then
              status=fail
              echo "cmd=cargo run -p invocation-fuzzer --locked -- smoke --seed $seed --cases 512 --corpus-dir crash/corpus" > crash/meta
              break
            fi
            sigs=$(grep -o 'behavior_signatures=[0-9]*' crash/log.txt | cut -d= -f2)
            [ "${sigs:-0}" -gt "$max_sigs" ] && max_sigs=$sigs
            runs=$((runs + 1))
          done
          corpus=$(ls "$CORPUS_DIR"/*.json | wc -l)
          echo "{\"date\":\"$(date -u +%F)\",\"runs\":$runs,\"corpus\":$corpus,\"signatures\":$max_sigs,\"status\":\"$status\"}" >> "$HISTORY_FILE"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Corpus and coverage trend
        if: always()
        run: |
          {
            echo "## Nightly fuzz trend"
            echo "| Date | Campaigns | Corpus size | Behaviour signatures (coverage) | Status |"
            echo "|---|---|---|---|---|"
            tail -n 14 "$HISTORY_FILE" | jq -r '"| \(.date) | \(.runs) | \(.corpus) | \(.signatures) | \(.status) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save persisted corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz-state
          key: fuzz-state-${{ github.run_id }}

      - name: Build reproducer bundle
        if: steps.fuzz.outputs.status == 'fail'
        id: triage
        run: |
          cmd=$(sed -n 's/^cmd=//p' crash/meta)
          # Signature and severity: tools/ci/fuzz_triage.py (unit-tested in CI).
          python3 tools/ci/fuzz_triage.py triage crash/log.txt > crash/triage.txt
          sig=$(sed -n 's/^sig=//p' crash/triage.txt)
          severity=$(sed -n 's/^severity=//p' crash/triage.txt)
          cp -r "$CORPUS_DIR" crash/corpus
          printf '%s\n' "$cmd" > crash/REPRODUCE.txt
          { echo "sig=$sig"; echo "severity=$severity"; echo "cmd=$cmd"; } >> "$GITHUB_OUTPUT"

      - name: Upload reproducer
        if: steps.fuzz.outputs.status == 'fail'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ steps.triage.outputs.sig }}
          path: crash
          retention-days: 30

      - name: Open or update tracking issue
        if: steps.fuzz.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
          SIG: ${{ steps.triage.outputs.sig }}
          SEVERITY: ${{ steps.triage.outputs.severity }}
          CMD: ${{ steps.triage.outputs.cmd }}
        run: |
          title="fuzz crash [$SIG]"
          labels="fuzz-crash"
          [ "$SEVERITY" = high ] && labels="$labels,severity:high"
          for l in fuzz-crash severity:high; do gh label create "$l" --force >/dev/null 2>&1 || true; done
          body="Crash signature \`$SIG\` (severity: $SEVERITY) in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Reproduce:
          \`\`\`bash
          $CMD
          \`\`\`
          The reproducer bundle (log + corpus) is the \`fuzz-crash-$SIG\` artifact on that run."
          existing=$(gh issue list --state open --label fuzz-crash --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$labels" --body "$body"
          fi
          exit 1
