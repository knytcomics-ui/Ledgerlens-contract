name: Contract CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Caching policy (#1224, docs/ci-performance.md): incremental compilation
  # is useless with sccache and bloats caches.
  CARGO_INCREMENTAL: 0

# Read-only token by default; jobs that need more request it explicitly.
permissions:
  contents: read

# Cancel superseded runs on pull requests only. Pushes to main (and any tag)
# get a unique group per commit, so they are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  # Heavy jobs gate on these outputs so docs-only PRs skip them. Pushes to main
  # always run the full pipeline. See docs/ci-gate.md.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      spec: ${{ github.event_name != 'pull_request' || steps.filter.outputs.spec == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'contracts/**'
              - 'tools/**'
              - 'tests/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            spec:
              - 'spec/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable sccache (restore-only on PRs)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: cargo clippy --all-targets -- -D warnings

  contract-build-lints:
    name: Contract-only dead-code check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable sccache (restore-only on PRs)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: tools/check_contract_build_lints.sh

  # ── Test tiers (#1244) ──────────────────────────────────────────────────────
  #
  # test-tiers.toml is the machine-readable inventory of every test unit and the
  # tier that runs it. `test-tiers-manifest` is the cheap gate: it fails in
  # seconds if a test exists that no tier runs, if a newly wired module was not
  # classified, or if a tier or budget changed without a `reviewed` annotation.
  # The two execution jobs then run the fast and standard tiers with their own
  # wall-clock budgets, each unit timed separately so a slow suite is
  # attributable.
  #
  # This replaces the old undifferentiated `cargo test --workspace` job: fast +
  # standard covers every wired unit except the five nightly ones, which
  # `.github/workflows/nightly-tests.yml` runs on a schedule and on demand.
  #
  # `--base` is the PR base SHA (or the pre-push SHA on main) so the review gate
  # can diff this revision's manifest against the one it is replacing. The
  # all-zero `before` SHA on a branch's first push means "no base", in which
  # case the review diff is skipped rather than faked.
  # ─────────────────────────────────────────────────────────────────────────────

  test-tiers-manifest:
    name: Test tier manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve base revision for the tier-move review
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
          fi
          case "$sha" in
            ""|0000000000000000000000000000000000000000) sha="" ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check every test is classified and no tier moved unreviewed
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then
            python3 tools/test-tiering.py check --base "${{ steps.base.outputs.sha }}"
          else
            python3 tools/test-tiering.py check
          fi
      - name: Prove the gate still detects a bad manifest
        run: python3 tools/test-tiering.py selftest

  test-tiers-fast:
    name: "Test tier: fast"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@v2
      - name: Resolve base revision for the tier-move review
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
          fi
          case "$sha" in
            ""|0000000000000000000000000000000000000000) sha="" ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run the fast tier (3-minute execution budget)
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then
            scripts/test-tier.sh fast --base "${{ steps.base.outputs.sha }}"
          else
            scripts/test-tier.sh fast
          fi
      - name: Upload the fast tier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-tier-fast-report
          path: target/test-tiers/
          retention-days: 14

  test-tiers-standard:
    name: "Test tier: standard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@v2
      - name: Resolve base revision for the tier-move review
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
          fi
          case "$sha" in
            ""|0000000000000000000000000000000000000000) sha="" ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run the standard tier (30-minute execution budget)
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then
            scripts/test-tier.sh standard --base "${{ steps.base.outputs.sha }}"
          else
            scripts/test-tier.sh standard
          fi
      - name: Upload the standard tier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-tier-standard-report
          path: target/test-tiers/
          retention-days: 14

  # ── Feature-tier profile matrix (issue #1193) ───────────────────────────────
  #
  # Builds and tests each documented Cargo feature profile so operators can
  # pick a core / standard / full deployment. Each profile is compiled with
  # `--no-default-features` plus its explicit feature set, so a feature that
  # is off is genuinely absent from the ABI (not present-and-failing).
  #
  #   core     — minimal ledger surface only.
  #   standard — core + governance + privacy + proofs.
  #   full     — standard + oracle + dispute (the default release profile).
  #
  # The per-profile WASM size budget is enforced by scripts/check-wasm-size.sh
  # (which reads the profile name from WASM_PROFILE) and the ABI/schema
  # snapshot for each profile is produced by scripts/abi-snapshot.sh so the
  # diff gate compares like-for-like snapshots.
  # ─────────────────────────────────────────────────────────────────────────────

  feature-profiles:
    name: Feature profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            features: ""
          - profile: standard
            features: "governance,privacy,proofs"
          - profile: full
            features: "governance,privacy,proofs,oracle,dispute"
    env:
      WASM_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build profile WASM
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            -p ledgerlens-score \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --locked
      - name: Test profile subset
        run: |
          cargo test \
            -p ledgerlens-score \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --locked
      - name: Enforce per-profile WASM size budget
        run: ./scripts/check-wasm-size.sh
      - name: Generate per-profile ABI/schema snapshot
        run: ./scripts/abi-snapshot.sh "${{ matrix.profile }}"
      - name: Upload profile ABI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: abi-snapshot-${{ matrix.profile }}
          path: target/abi-snapshot-${{ matrix.profile }}.json
          retention-days: 7

  production-acceptance:
    name: Production acceptance report
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable sccache (restore-only on PRs)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: Run production acceptance suite
        run: scripts/production-acceptance.sh --output target/production-readiness-report.md
      - name: Upload production readiness report
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: target/production-readiness-report.md
          retention-days: 14

  error-discriminants:
    name: Error discriminant stability
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The checker's own test suite (tests/check_error_discriminants.test.sh) is
      # a unit in the fast tier; this job keeps the base-vs-HEAD comparison,
      # which needs the PR base SHA and is therefore not a tier unit.
      - name: Check Error enum discriminants are append-only
        run: tools/check_error_discriminants.sh "${{ github.event.pull_request.base.sha }}" HEAD

  doc-snippets:
    name: Executable documentation snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Issue #1230: README function signatures and struct listings must match
      # the contract source; shell snippets must parse, and `run` snippets must
      # pass in a hermetic sandbox. Pure Python, no network, <1s.
      - name: Test the snippet checker
        run: python3 tools/check_doc_snippets.py --self-test
      - name: Check README and integration-guide snippets
        run: python3 tools/check_doc_snippets.py
      - name: Docs build failure-loudness (#1404)
        run: python3 tools/docs-site/test_failure_loud.py
      - name: CI tooling self-tests (fuzz triage #1403, metrics validation #1405)
        run: |
          python3 tools/ci/fuzz_triage.py selftest
          python3 tools/ci/job_durations.py selftest

  build:
    name: WASM build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable sccache (restore-only on PRs)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Record WASM byte-size evidence
        run: |
          mkdir -p target
          {
            echo "# WASM Size Evidence"
            echo ""
            echo "Path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm"
            echo "Bytes: $(wc -c < target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | tr -d ' ')"
            echo "SHA-256: $(sha256sum target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | awk '{print $1}')"
          } > target/wasm-size-report.md
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-wasm
          path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          retention-days: 7
      - name: Upload WASM size report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-wasm-size-report
          path: target/wasm-size-report.md
          retention-days: 7
      - name: Enforce WASM size budget
        run: ./scripts/check-wasm-size.sh

  # ── Contract metadata & build provenance (issue #1167) ──────────────────────
  #
  # The release WASM must carry deterministic build/interface metadata custom
  # sections (source repository, commit, crate version, toolchain versions and
  # interface version) so explorers and auditors can tie a deployed hash back
  # to a source revision. This job:
  #   • builds the contract twice from independent target dirs and asserts the
  #     two artifacts are byte-identical (reproducibility, metadata included);
  #   • enforces presence of every required metadata key in the built WASM;
  #   • runs the verification script against a release manifest and confirms it
  #     fails on a tampered artifact.
  # Metadata generation is deterministic: no timestamps, no host paths.
  contract-metadata:
    name: Contract metadata & provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build release WASM (build A)
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Build release WASM (build B)
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Assert byte-identical reproducible builds
        run: |
          A=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          B=target/repro-b/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          sha256sum "$A" "$B"
          cmp "$A" "$B"
      - name: Enforce required metadata keys
        run: |
          WASM=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          scripts/verify-deployment.sh --check-metadata "$WASM"
      - name: Verify release manifest and tamper detection
        run: |
          WASM=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          scripts/verify-deployment.sh --emit-manifest target/release-manifest.json "$WASM"
          scripts/verify-deployment.sh --manifest target/release-manifest.json "$WASM"
          cp "$WASM" target/tampered.wasm
          printf '\x00' | dd of=target/tampered.wasm bs=1 seek=8 count=1 conv=notrunc
          if scripts/verify-deployment.sh --manifest target/release-manifest.json target/tampered.wasm; then
            echo "::error::verification script accepted a tampered artifact"
            exit 1
          fi
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-release-manifest
          path: target/release-manifest.json
          retention-days: 7

  audit:
    name: Security audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-audit 0.22 requires Rust 1.88+ and understands the CVSS 4.0
          # records now present in the live RustSec advisory database. This job
          # only inspects Cargo.lock; contract builds remain pinned to Rust 1.81.
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        # RUSTSEC-2026-0009 affects time's RFC parsing. time is only pulled in
        # through serde_with -> stellar-xdr; the contract does not invoke that
        # parsing path. The fixed time release requires Edition 2024 and cannot
        # be parsed by the Rust 1.81 toolchain required for deployable Soroban
        # WASM. Keep this exception narrow and remove it when Soroban permits a
        # newer release toolchain.
        run: cargo +1.88.0 audit --ignore RUSTSEC-2026-0009

  # ── Dependency license / policy gate ────────────────────────────────────────
  #
  # Enforces the cargo-deny policy codified in deny.toml:
  #   • licenses — only the explicitly allow-listed permissive licenses may
  #     appear anywhere in the locked dependency graph (no copyleft).
  #   • bans     — no wildcard path dependencies; multiple versions warn.
  #   • advisories — no yanked or unmaintained crates (documented exceptions
  #     for toolchain-pinned crates live in deny.toml's `[advisories].ignore`).
  #   • sources  — only crates.io / pinned git registries.
  #
  # A PR that introduces a disallowed license, a yanked crate, or an
  # unmaintained crate not covered by a documented exception fails here.
  #
  # The 1.88.0 toolchain is used only to install the latest cargo-deny (same
  # pattern as the `audit` job); contract builds remain pinned to Rust 1.81.
  # ─────────────────────────────────────────────────────────────────────────────

  dependency-license:
    name: Dependency license & policy gate
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          # Only trusted pushes to main write caches; PRs (including forks)
          # restore only, so they can never poison a cache main will read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        run: cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - name: Run cargo-deny checks (licenses, bans, advisories, sources)
        run: cargo-deny check

  # ── Supply-chain integrity checks ───────────────────────────────────────────
  #
  # Verifies that:
  #   1. Every crate in Cargo.lock originates from a pinned, expected registry
  #      (crates.io or git with an exact rev) — no path-only or unpinned
  #      sources that could silently change between runs.
  #   2. The release WASM artifact is signed with a detached SHA-256 manifest
  #      so downstream consumers can verify provenance.
  #   3. The toolchain pin in rust-toolchain.toml matches what CI actually uses.
  #
  # Failure modes that cause this job to fail (acceptance criteria):
  #   • Any Cargo.lock entry whose `source` field is absent (local path crates
  #     that have been accidentally published) or points to an unexpected registry.
  #   • The WASM artifact SHA-256 in the signed manifest does not match the
  #     freshly built binary.
  #   • The active rustc version does not match rust-toolchain.toml.
  #
  # See docs/supply-chain.md for the full policy and manual audit procedure.
  # ─────────────────────────────────────────────────────────────────────────────

  supply-chain:
    name: Supply-chain integrity
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master (2026-08-05)
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      # ── Step 1: Verify the active toolchain matches rust-toolchain.toml ──────
      - name: Verify toolchain pin
        run: |
          EXPECTED=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          ACTUAL=$(rustc --version | awk '{print $2}')
          echo "rust-toolchain.toml channel : $EXPECTED"
          echo "Active rustc version        : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: toolchain mismatch — CI used $ACTUAL but rust-toolchain.toml pins $EXPECTED"
            exit 1
          fi
          echo "OK: toolchain pin verified."

      # ── Step 2: Verify Cargo.lock registry sources ────────────────────────────
      # Each non-workspace crate in Cargo.lock must declare a `source` that is
      # either:
      #   (a) "registry+https://github.com/rust-lang/crates.io-index"
      #   (b) a git source with an explicit `rev` lock
      # Path-only entries (workspace members) are explicitly allowed.
      # Any entry from an unknown registry causes the job to fail.
      - name: Verify Cargo.lock registry sources
        run: |
          python3 - <<'EOF'
          import re, sys

          with open("Cargo.lock") as f:
              content = f.read()

          ALLOWED_REGISTRY = "registry+https://github.com/rust-lang/crates.io-index"

          # Parse [[package]] blocks
          blocks = re.split(r'\n\[\[package\]\]', content)
          violations = []
          for block in blocks:
              name_m = re.search(r'name\s*=\s*"([^"]+)"', block)
              src_m  = re.search(r'source\s*=\s*"([^"]+)"', block)
              if not name_m:
                  continue
              name = name_m.group(1)
              if not src_m:
                  # No source = workspace path crate; allowed.
                  continue
              src = src_m.group(1)
              if src == ALLOWED_REGISTRY:
                  continue
              if src.startswith("git+") and "rev=" in src:
                  continue  # pinned git source
              violations.append(f"  {name}: {src}")

          if violations:
              print("ERROR: Cargo.lock contains unexpected or unpinned registry sources:")
              for v in violations:
                  print(v)
              print("")
              print("Only crates.io and git sources with a pinned rev are permitted.")
              print("See docs/supply-chain.md for the policy.")
              sys.exit(1)

          print(f"OK: all Cargo.lock registry sources verified.")
          EOF

      # ── Step 3: Build WASM and produce a signed SHA-256 manifest ─────────────
      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked

      - name: Sign WASM artifact (SHA-256 manifest)
        run: |
          WASM=target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          MANIFEST=target/ledgerlens_score.wasm.sha256
          sha256sum "$WASM" > "$MANIFEST"
          echo "Manifest written:"
          cat "$MANIFEST"

      - name: Verify WASM artifact against manifest
        run: |
          MANIFEST=target/ledgerlens_score.wasm.sha256
          sha256sum --check "$MANIFEST"
          echo "OK: WASM artifact integrity verified."

      # ── Step 4: Generate a CycloneDX SBOM for the shipped WASM ────────────────
      # Produces a CycloneDX JSON SBOM of the workspace dependency graph as
      # compiled for the wasm32-unknown-unknown target — i.e. the dependency
      # graph actually embedded in the released ledgerlens_score.wasm. Being
      # generated in this same job, from the same commit and lockfile, ties the
      # SBOM to the exact binary whose SHA-256 manifest was signed above.
      #
      # Note: SBOM generation deliberately lives in the supply-chain job, NOT in
      # the reproducible-build double-build jobs. CyclingDX embeds a build
      # timestamp, so adding it to the reproducibility comparison would
      # introduce non-determinism; the byte-for-byte WASM comparison remains
      # clean on its own.
      - name: Install cargo-cyclonedx
        run: cargo +1.81.0 install cargo-cyclonedx --version 0.5.8 --locked

      - name: Generate & validate CycloneDX SBOM (wasm32 target)
        run: tools/generate_sbom.sh

      - name: Upload WASM SHA-256 manifest
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.1
        with:
          name: ledgerlens-score-wasm-sha256-manifest
          path: target/ledgerlens_score.wasm.sha256
          retention-days: 90

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.1
        with:
          name: ledgerlens-sbom-cdx
          path: target/sbom/*.cdx.json
          retention-days: 90


  #
  # Builds the release WASM twice in two completely independent containers and
  # asserts the resulting files are byte-identical by comparing their SHA-256
  # digests.  A mismatch means something in the toolchain or build inputs is
  # non-deterministic — the job fails and surfaces the differing hashes.
  #
  # Both jobs must complete before the comparison step, so they run in parallel
  # first and the compare step depends on both via `needs`.
  #
  # See docs/reproducible-builds.md for the local verification procedure.
  # ─────────────────────────────────────────────────────────────────────────────

  repro-build-1:
    name: Reproducible build (run 1)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      # Deliberately no Swatinem/rust-cache — each run must be a cold,
      # independent build to prove there is no cache-based non-determinism.
      - name: Assert cold build (no compiler or target cache)
        run: |
          if [ -n "${RUSTC_WRAPPER:-}" ] || [ -n "${SCCACHE_GHA_ENABLED:-}" ] || [ -d target ]; then
            echo "::error::Reproducible builds must not use sccache, rust-cache or a pre-existing target dir"
            exit 1
          fi
      - name: Build WASM (run 1)
        run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Compute SHA-256 (run 1)
        id: hash1
        run: |
          SHA=$(sha256sum target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Run 1 SHA-256: $SHA"
      - name: Upload WASM artifact (run 1)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-run-1
          path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          retention-days: 1

  repro-build-2:
    name: Reproducible build (run 2)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      # No cache — independent cold build, same as run 1.
      - name: Assert cold build (no compiler or target cache)
        run: |
          if [ -n "${RUSTC_WRAPPER:-}" ] || [ -n "${SCCACHE_GHA_ENABLED:-}" ] || [ -d target ]; then
            echo "::error::Reproducible builds must not use sccache, rust-cache or a pre-existing target dir"
            exit 1
          fi
      - name: Build WASM (run 2)
        run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Compute SHA-256 (run 2)
        id: hash2
        run: |
          SHA=$(sha256sum target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Run 2 SHA-256: $SHA"
      - name: Upload WASM artifact (run 2)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-run-2
          path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          retention-days: 1

  repro-verify:
    name: Verify WASM reproducibility
    needs: [repro-build-1, repro-build-2]
    runs-on: ubuntu-latest
    steps:
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          path: wasm-artifacts
      - name: Compare SHA-256 digests
        run: |
          SHA1=$(sha256sum wasm-artifacts/wasm-run-1/ledgerlens_score.wasm | awk '{print $1}')
          SHA2=$(sha256sum wasm-artifacts/wasm-run-2/ledgerlens_score.wasm | awk '{print $1}')
          echo "Run 1 SHA-256: $SHA1"
          echo "Run 2 SHA-256: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo ""
            echo "ERROR: WASM output is NOT reproducible."
            echo "  Run 1: $SHA1"
            echo "  Run 2: $SHA2"
            echo ""
            echo "The two independent builds produced different bytecode."
            echo "Check for non-deterministic build inputs (timestamps, paths,"
            echo "env vars, or codegen flags).  See docs/reproducible-builds.md."
            exit 1
          fi
          echo ""
          echo "SUCCESS: Both builds produced identical WASM output."
          echo "  SHA-256: $SHA1"

  spec-model-check:
    name: TLA+ spec TLC model checking
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache TLA+ tools
        uses: actions/cache@v4
        with:
          path: /tmp/tla2tools.jar
          key: tla2tools-v1.8.0

      - name: Download tla2tools.jar
        run: |
          if [ ! -f /tmp/tla2tools.jar ]; then
            curl -sL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          fi

      - name: Run TLC Model Checker on LedgerLens spec
        run: |
          cd spec
          java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -simulate num=20000 -depth 30 -config LedgerLens.cfg LedgerLens.tla

      - name: Set up Rust for model-to-contract replay
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@v2

      - name: Replay bounded TLC behaviors against the Rust contract
        run: python3 tools/validate_tla_trace_replay.py --jar /tmp/tla2tools.jar

  environment-smoke:
    name: Development environment smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tool-versions
        uses: ./.github/actions/tool-versions
      - name: Build devcontainer image
        run: docker build -f .devcontainer/Dockerfile -t ledgerlens-dev .
      - name: Check pinned tools inside the image
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ledgerlens-dev bash -lc '
            rustc --version | grep -F "${{ steps.tool-versions.outputs.contract-rust }}"
            rustc +${{ steps.tool-versions.outputs.audit-rust }} --version
            rustup target list --installed | grep -qx wasm32-unknown-unknown
            stellar --version | grep -F "${{ steps.tool-versions.outputs.stellar-cli }}"
            cargo-mutants --version | grep -F "${{ steps.tool-versions.outputs.cargo-mutants }}"
            cargo-audit --version | grep -F "${{ steps.tool-versions.outputs.cargo-audit }}"
            cargo-deny --version | grep -F "${{ steps.tool-versions.outputs.cargo-deny }}"
            cargo-cyclonedx --version | grep -F "${{ steps.tool-versions.outputs.cargo-cyclonedx }}"
            shellcheck --version | grep -F "${{ steps.tool-versions.outputs.shellcheck }}"
            java -version 2>&1 | grep -F "${{ steps.tool-versions.outputs.java }}"
            test -f "$TLA_TOOLS_JAR"
          '

  # ── Required-check aggregator ───────────────────────────────────────────────
  # The ONLY status check branch protection should require. Skipped jobs
  # (path-filtered or event-conditional) count as success; any failure or
  # cancellation fails the gate. Every new job MUST be added to `needs`.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - contract-build-lints
      - test-tiers-manifest
      - test-tiers-fast
      - test-tiers-standard
      - production-acceptance
      - error-discriminants
      - build
      - audit
      - dependency-license
      - supply-chain
      - repro-build-1
      - repro-build-2
      - repro-verify
      - spec-model-check
      - doc-snippets
      - environment-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Summarise job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled jobs: $bad"
            exit 1
          fi
          echo "All required jobs succeeded or were intentionally skipped."
